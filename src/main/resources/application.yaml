spring:
  application:
    name: ss17-bt05-cache-fallback
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      connect-timeout: 200ms
  datasource:
    url: jdbc:h2:mem:grabfood_menu_fallback;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
server:
  port: 8625

menu:
  cache:
    ttl: 5m

logging:
  level:
    org.springframework.cache: TRACE
